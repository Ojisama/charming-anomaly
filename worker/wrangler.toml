name = "charming-anomaly-sync"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Created 2026-08-04 with a WEUR primary location: D1 writes go to the primary, and the owner and
# the first players are in Europe. `wrangler dev --local` ignores this id entirely — local D1 is a
# SQLite file under .wrangler/state, which is what test.sh runs against.
[[d1_databases]]
binding = "DB"
database_name = "charming-anomaly-sync"
database_id = "5b826e56-9fe7-4930-98fa-ede74f4a2ca0"

# Design §10. Keyed on the code HASH, not an IP, and it works on *.workers.dev — which matters
# because this deployment has no Cloudflare zone (the game is served from ojisama.github.io with no
# CNAME), so WAF rate-limiting rules have nothing to attach to. Enforced per Cloudflare location, so
# it is a loose filter rather than a hard cap. §10 is explicit that the 100k/day account budget is
# unprotectable on the free tier as deployed; this narrows the cheap cases, it does not close them.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

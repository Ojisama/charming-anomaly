# test.sh only. Identical to wrangler.toml except the placeholder database_id — the rate limit now
# MATCHES production (both 40), where this file used to raise it above a production 10 so the ~30
# functional assertions against one code were not throttled.
#
# KEEP THIS FILE AND THIS BLOCK EVEN THOUGH THE NUMBERS AGREE. Deleting the override would re-couple
# the suite's headroom to a production knob that is tuned for players, not for tests: the next tune
# downward silently starts throttling the functional assertions, and a throttled assertion fails as
# a wrong STATUS CODE, which reads as a broken endpoint rather than as a limit. The real numbers are
# still asserted from wrangler.toml by the suite, and the enforcement path is still exercised by
# hammering a fresh code past this limit.
name = "charming-anomaly-sync"
main = "src/index.js"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "charming-anomaly-sync"
database_id = "PLACEHOLDER-REPLACE-AFTER-d1-create"

[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 40, period = 60 }
